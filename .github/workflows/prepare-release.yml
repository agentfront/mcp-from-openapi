name: Prepare Release

# Opens the release pull request of a release/X.Y.x branch: the version bump and CHANGELOG.md entry as its
# change, the release notes as its description. Merging it publishes (publish-release.yml).

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - stable
          - rc
          - beta
        default: stable
      pre_release_number:
        description: "Pre-release number (for rc/beta, leave empty for auto-increment)"
        required: false
        type: string
      dry_run:
        description: "Dry run (show the version and notes in the run summary, open no pull request)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notes:
    name: Version and release notes
    runs-on: ubuntu-latest
    # Reads the repository and calls the notes model; it can write nothing
    permissions:
      contents: read
    # Inputs reach the shell as variables, never as script text
    env:
      RELEASE_TYPE: ${{ inputs.release_type }}
      PRE_RELEASE_NUM: ${{ inputs.pre_release_number }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      branch: ${{ steps.context.outputs.branch }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set the release directory
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          echo "RELEASE_DIR=$RUNNER_TEMP/release" >> "$GITHUB_ENV"

      - name: Validate branch
        id: context
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF#refs/heads/}"
          if [[ ! "$BRANCH" =~ ^release/[0-9]+\.[0-9]+\.x$ ]]; then
            echo "::error::This workflow must be run from a release/X.Y.x branch. Current branch: $BRANCH"
            exit 1
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "release_line=$(echo "$BRANCH" | sed 's/release\/\([0-9]*\.[0-9]*\).*/\1/')" >> "$GITHUB_OUTPUT"

      # Node only: no dependency is installed in a job holding the notes model key
      - name: Setup Node
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version-file: ".nvmrc"
          install: "false"

      - name: Compute version
        id: version
        shell: bash
        env:
          RELEASE_LINE: ${{ steps.context.outputs.release_line }}
        run: |
          set -euo pipefail

          # A dispatch through the API is not held to the input's choices
          if ! [[ "$RELEASE_TYPE" =~ ^(stable|rc|beta)$ && "$PRE_RELEASE_NUM" =~ ^[0-9]*$ ]]; then
            echo "::error::release_type must be stable, rc or beta and pre_release_number a number"
            exit 1
          fi

          git fetch --tags
          if [ -n "$PRE_RELEASE_NUM" ]; then
            VERSION=$(node scripts/compute-next-patch.mjs "$RELEASE_LINE" "$RELEASE_TYPE" "$PRE_RELEASE_NUM")
          else
            VERSION=$(node scripts/compute-next-patch.mjs "$RELEASE_LINE" "$RELEASE_TYPE")
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists!"
            exit 1
          fi

          # The latest stable tag of this line, else of any line
          PREV_TAG=$(git tag --list "v${RELEASE_LINE}.*" --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (previous: ${PREV_TAG:-none})"

      - name: Collect commits and diff
        env:
          PREV_TAG: ${{ steps.version.outputs.prev_tag }}
        run: |
          if [ -n "$PREV_TAG" ]; then
            git diff "$PREV_TAG"..HEAD \
              --stat --patch \
              -- '*.ts' '*.js' '*.json' ':!package-lock.json' ':!*.test.ts' ':!*.spec.ts' ':!e2e/fixtures/**' \
              | head -c 50000 > /tmp/diff.txt
            # Commit subjects are the PRIMARY signal for the notes generator —
            # the repo uses one-line conventional commits, so this list is the
            # authoritative inventory of what shipped.
            git log "$PREV_TAG"..HEAD --no-merges --format='- %s' > /tmp/commits.txt
          else
            echo "Initial release - no previous version to compare" > /tmp/diff.txt
            echo "- Initial release" > /tmp/commits.txt
          fi

      - name: Generate AI release notes
        if: ${{ inputs.release_type == 'stable' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERSION: v${{ steps.version.outputs.version }}
          PREV_TAG: ${{ steps.version.outputs.prev_tag }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const diff = fs.readFileSync('/tmp/diff.txt', 'utf8');
            const commits = fs.readFileSync('/tmp/commits.txt', 'utf8');
            const docsFiles = fs.readdirSync('docs').filter((f) => f.endsWith('.md')).sort().join('\n');
            const releaseDate = new Date().toISOString().split('T')[0];
            const version = process.env.VERSION;
            const versionNum = version.replace('v', '');
            const prevTag = process.env.PREV_TAG || '(none)';

            const prompt = `You are writing the public release notes for mcp-from-openapi, a TypeScript library that converts OpenAPI specifications into MCP (Model Context Protocol) tool definitions. Your readers are developers deciding whether to upgrade. The whole page must be readable in under two minutes — brevity outranks completeness everywhere except the collapsed change list and the behavior-changes table.

            Version: ${version}
            Release date: ${releaseDate}
            Previous version: ${prevTag}

            Commit subjects since ${prevTag} — the PRIMARY source of truth for WHAT shipped:
            ${commits}

            Supporting git diff excerpt — use it to find exact exported API names, option names, and realistic code for snippets:
            \`\`\`
            ${diff.substring(0, 40000)}
            \`\`\`

            Documentation files that exist in docs/ — the ONLY valid link targets; copy a filename from this list verbatim or do not link at all:
            ${docsFiles}

            Generate four outputs as JSON: {"title": "...", "changelog": "...", "changelogEntry": "...", "cardMdx": "..."}

            === OUTPUT 1: "title" — a 3-6 word headline naming the flagship capability ===
            Plain text, no version number, no markdown. It becomes the GitHub release title next to the version.

            === OUTPUT 2: "changelog" — the release page body in GitHub-flavored markdown ===
            CRITICAL: do NOT start with a heading or repeat the version/title — the release page already shows them. Structure, in order:

            <One- or two-sentence opener sizing the release honestly. Concrete numbers ONLY if visible in the diff stat.>

            ## ✨ Highlights
            <At most 3 flagship changes. Each: one bold lead sentence on WHY a developer cares, then a runnable TypeScript snippet of AT MOST 4 lines using REAL exported API names from the diff. Small releases may have 1 highlight or none — never pad.>

            ## 🔒 Security
            <Only if security-relevant changes exist: one line per change. Never bury a security fix elsewhere.>

            ## 🛠 Also in this release
            <At most 6 one-line bullets for the remaining noteworthy changes, "what changed — why you care". Everything else lives ONLY in the collapsed list below.>

            ## ⚠️ Upgrading
            <A markdown table "Change | Impact" for anything an existing user must know: changed defaults, newly-enforced options, normalized/reordered output. Impact column: one short clause. OMIT the whole section if nothing changed for existing users.>

            <details>
            <summary><b>Full change list</b></summary>
            <Every commit subject from the list above, grouped under Features / Fixes / Security. Nothing may be silently dropped. This is the ONLY place for exhaustive detail.>
            </details>

            ## Installation
            \`\`\`bash
            npm install mcp-from-openapi@${versionNum}
            \`\`\`

            Writing rules — these outrank everything else:
            - Claim ONLY what the commit subjects and diff show. Never invent features, API names, numbers, or benchmarks.
            - Lead with the user-facing benefit; implementation detail comes second or not at all.
            - Short, complete sentences. Ban filler ("various improvements", "minor fixes", "enhanced support").
            - Link documentation with absolute URLs (https://github.com/agentfront/mcp-from-openapi/blob/main/docs/<file>.md) ONLY using filenames copied verbatim from the docs/ list above — NEVER guess or construct a filename; at most one links line.
            - Behavior changes are sacred: if a default changed or output changed shape, it MUST appear in the ⚠️ table.

            === OUTPUT 3: "changelogEntry" — a Keep a Changelog section for CHANGELOG.md ===
            Plain markdown, EXACTLY this shape (no top heading — the workflow adds "## [${versionNum}] - ${releaseDate}"):

            ### Added / ### Changed / ### Fixed / ### Security
            <Only the sections that apply. One line per change, factual and terse, no emoji, no code fences. Cover everything meaningful — this is the historical record, not marketing.>

            === OUTPUT 4: "cardMdx" — a SINGLE Mintlify <Card> component, nothing else ===

            <Card
              title="mcp-from-openapi ${version}: <flagship capability headline>"
              href="https://github.com/agentfront/mcp-from-openapi/releases/tag/${version}"
              cta="View full changelog"
            >
              **<Flagship feature>** – <one-sentence developer benefit>.
              - <2-3 supporting bullets, most important first>
            </Card>

            Output ONLY valid JSON: {"title": "...", "changelog": "...", "changelogEntry": "...", "cardMdx": "<Card...>...</Card>"}`;

            const response = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                model: 'gpt-4o',
                messages: [{ role: 'user', content: prompt }],
                response_format: { type: 'json_object' },
                max_tokens: 8000
              })
            });

            if (!response.ok) throw new Error(`OpenAI API error: ${response.status}`);
            const data = await response.json();
            const result = JSON.parse(data.choices[0].message.content);

            // Every output travels in a file: none reaches a shell or an expression
            const dir = process.env.RELEASE_DIR;
            const title = String(result.title || '').replace(/[\r\n]+/g, ' ').trim().slice(0, 80);
            fs.writeFileSync(path.join(dir, 'title.txt'), title);
            fs.writeFileSync(path.join(dir, 'notes.md'), String(result.changelog || ''));
            fs.writeFileSync(path.join(dir, 'changelog-entry.md'), String(result.changelogEntry || ''));
            fs.writeFileSync(path.join(dir, 'card.mdx'), String(result.cardMdx || ''));

      - name: Assemble the pull request description
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.context.outputs.branch }}
        run: |
          set -euo pipefail
          BODY="$RELEASE_DIR/body.md"

          # The generated notes lead; without them (a pre-release, no model key) a plain installation note
          if [ -s "$RELEASE_DIR/notes.md" ]; then
            {
              cat "$RELEASE_DIR/notes.md"
              echo ""
              echo "---"
              echo ""
              echo "<sub>Release line: ${BRANCH#release/} · Branch: ${BRANCH} · Type: ${RELEASE_TYPE}</sub>"
            } > "$BODY"
          else
            {
              echo "**Release type:** ${RELEASE_TYPE}"
              echo ""
              echo "### Installation"
              echo ""
              echo '```bash'
              echo "npm install mcp-from-openapi@${VERSION}"
              echo '```'
            } > "$BODY"
          fi

          if [[ "$VERSION" == *-* ]]; then
            printf '\n> **Note:** This is a pre-release version.\n' >> "$BODY"
          fi

          # The docs card rides along as a hidden comment (`-->` written `--&gt;`; the consumer reverses it)
          if [ -s "$RELEASE_DIR/card.mdx" ]; then
            {
              echo ""
              echo "<!--"
              echo "CARD_MDX_START"
              sed 's/-->/--\&gt;/g' "$RELEASE_DIR/card.mdx"
              echo "CARD_MDX_END"
              echo "-->"
            } >> "$BODY"
          fi

          {
            echo "## Release v$VERSION from $BRANCH"
            echo ""
            cat "$BODY"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the notes for the pull request job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  pull-request:
    name: Open the release pull request
    needs: notes
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    # Pushes the release-pr branch, opens the pull request, and starts CI on it: a pull request
    # opened with this token starts no workflow by itself. No secret but this token.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      VERSION: ${{ needs.notes.outputs.version }}
      BASE: ${{ needs.notes.outputs.branch }}
      RELEASE_TYPE: ${{ inputs.release_type }}
      GH_TOKEN: ${{ github.token }}

    steps:
      # The commit the notes were written from
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set the release directory
        run: echo "RELEASE_DIR=$RUNNER_TEMP/release" >> "$GITHUB_ENV"

      - name: Get the notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release

      - name: Bump the version and write the changelog entry
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          # A stable release's entry goes under its own header, replacing the bare one
          # create-release-branch.yml writes for an X.Y.0
          if [ "$RELEASE_TYPE" = "stable" ] && [ -s "$RELEASE_DIR/changelog-entry.md" ]; then
            node -e "
              const fs = require('fs');
              const version = process.env.VERSION;
              const date = new Date().toISOString().split('T')[0];
              const entry = fs.readFileSync(process.env.RELEASE_DIR + '/changelog-entry.md', 'utf8').trim();
              let existing = fs.existsSync('CHANGELOG.md') ? fs.readFileSync('CHANGELOG.md', 'utf8') : '';
              const bareHeader = '## [' + version + ']';
              if (existing.startsWith(bareHeader)) existing = existing.slice(existing.indexOf('\n') + 1).replace(/^\n+/, '');
              fs.writeFileSync('CHANGELOG.md', '## [' + version + '] - ' + date + '\n\n' + entry + '\n\n' + existing);
            "
          fi

      - name: Push the release-pr branch
        id: push
        run: |
          set -euo pipefail
          HEAD_BRANCH="release-pr/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$HEAD_BRANCH"
          git add package.json CHANGELOG.md
          # Empty when nothing changed (an X.Y.0 without notes): the pull request still carries the release
          git commit --allow-empty -m "chore(release): v$VERSION"
          # A new run for the same version replaces the branch, and with it the pull request's change
          git push --force origin "HEAD:refs/heads/$HEAD_BRANCH"
          echo "head=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        id: pr
        env:
          HEAD_BRANCH: ${{ steps.push.outputs.head }}
        run: |
          set -euo pipefail
          TITLE="chore(release): v$VERSION"
          if [ -s "$RELEASE_DIR/title.txt" ]; then TITLE="$TITLE — $(cat "$RELEASE_DIR/title.txt")"; fi

          NUMBER=$(gh pr list --head "$HEAD_BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then
            gh pr edit "$NUMBER" --title "$TITLE" --body-file "$RELEASE_DIR/body.md"
          else
            URL=$(gh pr create --base "$BASE" --head "$HEAD_BRANCH" --title "$TITLE" --body-file "$RELEASE_DIR/body.md")
            NUMBER="${URL##*/}"
            NOTE="The description of this pull request is the release notes of v$VERSION, and its title (without \`chore(release): \`) the release name: edit both before merging. Merging publishes v$VERSION to npm once the \`release\` environment is approved, then tags the merge commit and creates the GitHub release."
            gh pr comment "$NUMBER" --body "$NOTE"
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Start CI on the release-pr branch
        env:
          HEAD_BRANCH: ${{ steps.push.outputs.head }}
        run: gh workflow run push.yml --ref "$HEAD_BRANCH"

      - name: Summary
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          {
            echo "## Release pull request for v$VERSION"
            echo ""
            echo "#$NUMBER into \`$BASE\`. Review the description (the release notes), then merge to publish."
          } >> "$GITHUB_STEP_SUMMARY"
