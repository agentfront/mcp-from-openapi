name: Publish Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - stable
          - rc
          - beta
        default: stable
      pre_release_number:
        description: "Pre-release number (for rc/beta, leave empty for auto-increment)"
        required: false
        type: string
      dry_run:
        description: "Dry run (skip actual publish)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate branch
        id: context
        shell: bash
        run: |
          set -euo pipefail

          # Get current branch
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          # Validate branch is a release branch
          if [[ ! "$BRANCH" =~ ^release/[0-9]+\.[0-9]+\.x$ ]]; then
            echo "::error::This workflow must be run from a release/X.Y.x branch. Current branch: $BRANCH"
            exit 1
          fi

          # Extract release line (X.Y) from release/X.Y.x
          RELEASE_LINE=$(echo "$BRANCH" | sed 's/release\/\([0-9]*\.[0-9]*\).*/\1/')
          echo "release_line=$RELEASE_LINE" >> "$GITHUB_OUTPUT"

          echo "Branch: $BRANCH"
          echo "Release line: $RELEASE_LINE"

      - name: Setup Node + Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org/"

      - name: Update npm CLI for trusted publishing
        run: npm install -g npm@latest

      - name: Compute version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_LINE="${{ steps.context.outputs.release_line }}"
          RELEASE_TYPE="${{ inputs.release_type }}"
          PRE_RELEASE_NUM="${{ inputs.pre_release_number }}"

          # Fetch all tags
          git fetch --tags

          # Use compute-next-patch script
          if [ -n "$PRE_RELEASE_NUM" ]; then
            VERSION=$(node scripts/compute-next-patch.mjs "$RELEASE_LINE" "$RELEASE_TYPE" "$PRE_RELEASE_NUM")
          else
            VERSION=$(node scripts/compute-next-patch.mjs "$RELEASE_LINE" "$RELEASE_TYPE")
          fi

          # Determine if this is a pre-release
          IS_PRERELEASE="false"
          NPM_TAG="latest"
          if [[ "$VERSION" == *"-rc."* ]]; then
            IS_PRERELEASE="true"
            NPM_TAG="rc"
          elif [[ "$VERSION" == *"-beta."* ]]; then
            IS_PRERELEASE="true"
            NPM_TAG="beta"
          fi

          # Check if tag already exists
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists!"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION"
          echo "Release type: $RELEASE_TYPE"
          echo "Is prerelease: $IS_PRERELEASE"
          echo "NPM tag: $NPM_TAG"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get previous version
        id: prev_version
        run: |
          RELEASE_LINE="${{ steps.context.outputs.release_line }}"
          # Get the latest stable tag for this release line
          PREV_TAG=$(git tag --list "v${RELEASE_LINE}.*" --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$PREV_TAG" ]; then
            # No previous tag in this line, try previous minor
            PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          fi
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "Previous tag: $PREV_TAG"

      - name: Generate diff
        id: diff
        run: |
          PREV_TAG="${{ steps.prev_version.outputs.prev_tag }}"
          if [ -n "$PREV_TAG" ]; then
            DIFF=$(git diff "$PREV_TAG"..HEAD \
              --stat --patch \
              -- '*.ts' '*.js' '*.json' ':!package-lock.json' ':!*.test.ts' ':!*.spec.ts' \
              | head -c 50000)
            # Commit subjects are the PRIMARY signal for the notes generator —
            # the repo uses one-line conventional commits, so this list is the
            # authoritative inventory of what shipped.
            git log "$PREV_TAG"..HEAD --no-merges --format='- %s' > /tmp/commits.txt
          else
            DIFF="Initial release - no previous version to compare"
            echo "- Initial release" > /tmp/commits.txt
          fi
          # Use file to avoid shell escaping issues
          echo "$DIFF" > /tmp/diff.txt

      - name: Generate AI changelog
        id: ai_changelog
        if: ${{ inputs.dry_run != true && inputs.release_type == 'stable' }}
        uses: actions/github-script@v9
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERSION: v${{ steps.version.outputs.version }}
          VERSION_MINOR: ${{ steps.context.outputs.release_line }}
          PREV_TAG: ${{ steps.prev_version.outputs.prev_tag }}
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('/tmp/diff.txt', 'utf8');
            const commits = fs.readFileSync('/tmp/commits.txt', 'utf8');
            const releaseDate = new Date().toISOString().split('T')[0];
            const version = process.env.VERSION;
            const versionNum = version.replace('v', '');
            const prevTag = process.env.PREV_TAG || '(none)';

            const prompt = `You are writing the public release notes for mcp-from-openapi, a TypeScript library that converts OpenAPI specifications into MCP (Model Context Protocol) tool definitions. Your readers are developers deciding whether to upgrade. The whole page must be readable in under two minutes — brevity outranks completeness everywhere except the collapsed change list and the behavior-changes table.

            Version: ${version}
            Release date: ${releaseDate}
            Previous version: ${prevTag}

            Commit subjects since ${prevTag} — the PRIMARY source of truth for WHAT shipped:
            ${commits}

            Supporting git diff excerpt — use it to find exact exported API names, option names, and realistic code for snippets:
            \`\`\`
            ${diff.substring(0, 40000)}
            \`\`\`

            Generate four outputs as JSON: {"title": "...", "changelog": "...", "changelogEntry": "...", "cardMdx": "..."}

            === OUTPUT 1: "title" — a 3-6 word headline naming the flagship capability ===
            Plain text, no version number, no markdown. It becomes the GitHub release title next to the version.

            === OUTPUT 2: "changelog" — the release page body in GitHub-flavored markdown ===
            CRITICAL: do NOT start with a heading or repeat the version/title — the release page already shows them. Structure, in order:

            <One- or two-sentence opener sizing the release honestly. Concrete numbers ONLY if visible in the diff stat.>

            ## ✨ Highlights
            <At most 3 flagship changes. Each: one bold lead sentence on WHY a developer cares, then a runnable TypeScript snippet of AT MOST 4 lines using REAL exported API names from the diff. Small releases may have 1 highlight or none — never pad.>

            ## 🔒 Security
            <Only if security-relevant changes exist: one line per change. Never bury a security fix elsewhere.>

            ## 🛠 Also in this release
            <At most 6 one-line bullets for the remaining noteworthy changes, "what changed — why you care". Everything else lives ONLY in the collapsed list below.>

            ## ⚠️ Upgrading
            <A markdown table "Change | Impact" for anything an existing user must know: changed defaults, newly-enforced options, normalized/reordered output. Impact column: one short clause. OMIT the whole section if nothing changed for existing users.>

            <details>
            <summary><b>Full change list</b></summary>
            <Every commit subject from the list above, grouped under Features / Fixes / Security. Nothing may be silently dropped. This is the ONLY place for exhaustive detail.>
            </details>

            ## Installation
            \`\`\`bash
            npm install mcp-from-openapi@${versionNum}
            \`\`\`

            Writing rules — these outrank everything else:
            - Claim ONLY what the commit subjects and diff show. Never invent features, API names, numbers, or benchmarks.
            - Lead with the user-facing benefit; implementation detail comes second or not at all.
            - Short, complete sentences. Ban filler ("various improvements", "minor fixes", "enhanced support").
            - Link documentation with absolute URLs (https://github.com/agentfront/mcp-from-openapi/blob/main/docs/<file>.md) ONLY for doc files that actually appear in the diff — at most one links line.
            - Behavior changes are sacred: if a default changed or output changed shape, it MUST appear in the ⚠️ table.

            === OUTPUT 3: "changelogEntry" — a Keep a Changelog section for CHANGELOG.md ===
            Plain markdown, EXACTLY this shape (no top heading — the workflow adds "## [${versionNum}] - ${releaseDate}"):

            ### Added / ### Changed / ### Fixed / ### Security
            <Only the sections that apply. One line per change, factual and terse, no emoji, no code fences. Cover everything meaningful — this is the historical record, not marketing.>

            === OUTPUT 4: "cardMdx" — a SINGLE Mintlify <Card> component, nothing else ===

            <Card
              title="mcp-from-openapi ${version}: <flagship capability headline>"
              href="https://github.com/agentfront/mcp-from-openapi/releases/tag/${version}"
              cta="View full changelog"
            >
              **<Flagship feature>** – <one-sentence developer benefit>.
              - <2-3 supporting bullets, most important first>
            </Card>

            Output ONLY valid JSON: {"title": "...", "changelog": "...", "changelogEntry": "...", "cardMdx": "<Card...>...</Card>"}`;

            const response = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                model: 'gpt-4o',
                messages: [{ role: 'user', content: prompt }],
                response_format: { type: 'json_object' },
                max_tokens: 8000
              })
            });

            if (!response.ok) throw new Error(`OpenAI API error: ${response.status}`);
            const data = await response.json();
            const result = JSON.parse(data.choices[0].message.content);

            // Write card MDX to file to avoid shell escaping issues
            fs.writeFileSync('/tmp/card-mdx.txt', result.cardMdx);
            // CHANGELOG.md entry travels via file (multi-line output escaping)
            fs.writeFileSync('/tmp/changelog-entry.txt', result.changelogEntry || '');

            const title = String(result.title || '').replace(/[\r\n]+/g, ' ').trim().slice(0, 80);
            core.setOutput('title', title);
            core.setOutput('changelog', result.changelog);
            core.setOutput('has_card_mdx', result.cardMdx ? 'true' : 'false');

      - name: Update package version
        if: ${{ inputs.dry_run != true }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Update CHANGELOG.md
        if: ${{ inputs.dry_run != true && inputs.release_type == 'stable' }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Merge the AI-generated Keep a Changelog entry under this version's
          # header. create-release-branch.yml prepends a BARE header for X.Y.0
          # releases — replace it instead of stacking a duplicate.
          if [ -s /tmp/changelog-entry.txt ]; then
            node -e "
              const fs = require('fs');
              const version = '$VERSION';
              const date = new Date().toISOString().split('T')[0];
              const entry = '## [' + version + '] - ' + date + '\n\n' + fs.readFileSync('/tmp/changelog-entry.txt', 'utf8').trim() + '\n';
              let existing = fs.existsSync('CHANGELOG.md') ? fs.readFileSync('CHANGELOG.md', 'utf8') : '';
              const bareHeader = new RegExp('^## \\\\[' + version.replace(/\./g, '\\\\.') + '\\\\][^\n]*\n+');
              if (bareHeader.test(existing)) {
                existing = existing.replace(bareHeader, '');
              }
              fs.writeFileSync('CHANGELOG.md', entry + '\n' + existing);
              console.log('CHANGELOG.md updated for ' + version);
            "
          else
            echo "No changelog entry generated; leaving CHANGELOG.md untouched"
          fi

      - name: Commit version bump
        if: ${{ inputs.dry_run != true }}
        run: |
          # One release commit: package.json version bump + CHANGELOG.md entry
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(release): v${{ steps.version.outputs.version }}"
            git push origin HEAD
          fi

      - name: Build package
        run: yarn build

      - name: Publish to npm
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          set -euo pipefail

          NPM_TAG="${{ steps.version.outputs.npm_tag }}"

          echo "Publishing mcp-from-openapi from dist/ with tag $NPM_TAG..."
          npm publish dist/ --access public --tag "$NPM_TAG" --provenance

          echo "Successfully published mcp-from-openapi@${{ steps.version.outputs.version }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create and push git tag
        if: ${{ inputs.dry_run != true }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          BRANCH="${{ steps.context.outputs.branch }}"

          # Fetch latest to ensure we tag the committed version
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git pull origin "$BRANCH"

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          echo "Created and pushed tag: $TAG"

      - name: Prepare release body
        id: release_body
        env:
          CHANGELOG: ${{ steps.ai_changelog.outputs.changelog }}
          AI_TITLE: ${{ steps.ai_changelog.outputs.title }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_TYPE="${{ steps.version.outputs.release_type }}"
          RELEASE_LINE="${{ steps.context.outputs.release_line }}"
          BRANCH="${{ steps.context.outputs.branch }}"
          IS_PRERELEASE="${{ steps.version.outputs.is_prerelease }}"

          # Release NAME carries the headline (the body never repeats it)
          if [ -n "$AI_TITLE" ]; then
            echo "release_name=v${VERSION} — ${AI_TITLE}" >> "$GITHUB_OUTPUT"
          else
            echo "release_name=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

          # The AI-generated notes LEAD the page (they carry their own title and
          # Installation section); release-pipeline metadata is a small footer.
          # Without AI notes (prerelease, missing key), fall back to the plain
          # header + installation body.
          if [ -f /tmp/card-mdx.txt ] && [ -s /tmp/card-mdx.txt ] && [ -n "$CHANGELOG" ]; then
            {
              echo "$CHANGELOG"
              echo ""
              echo "---"
              echo ""
              echo "<sub>Release line: ${RELEASE_LINE}.x · Branch: ${BRANCH} · Type: ${RELEASE_TYPE}</sub>"
            } > /tmp/release-body.md
          else
            {
              echo "## Release v${VERSION}"
              echo ""
              echo "**Release type:** ${RELEASE_TYPE}"
              echo "**Release line:** ${RELEASE_LINE}.x"
              echo "**Branch:** ${BRANCH}"
              echo ""
              echo "### Installation"
              echo ""
              echo '```bash'
              echo "npm install mcp-from-openapi@${VERSION}"
              echo '```'
            } > /tmp/release-body.md
          fi

          # Add pre-release note if applicable
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "" >> /tmp/release-body.md
            echo "> **Note:** This is a pre-release version." >> /tmp/release-body.md
          fi

          # Add Card MDX as hidden comment for docs sync (only for stable releases)
          # NOTE: Content is sanitized to prevent --> from breaking the HTML comment.
          # Consumer must reverse: replace "--&gt;" with "-->" after extraction.
          if [ -f /tmp/card-mdx.txt ] && [ -s /tmp/card-mdx.txt ]; then
            echo "" >> /tmp/release-body.md
            echo "<!--" >> /tmp/release-body.md
            echo "CARD_MDX_START" >> /tmp/release-body.md
            sed 's/-->/--\&gt;/g' /tmp/card-mdx.txt >> /tmp/release-body.md
            echo "CARD_MDX_END" >> /tmp/release-body.md
            echo "-->" >> /tmp/release-body.md
          fi

      - name: Create GitHub Release
        if: ${{ inputs.dry_run != true }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ${{ steps.release_body.outputs.release_name }}
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          generate_release_notes: false
          body_path: /tmp/release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "## Dry Run Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **This was a dry run. No packages were published.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Release Complete" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ steps.version.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | \`v${{ steps.version.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release type | ${{ steps.version.outputs.release_type }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| NPM tag | \`${{ steps.version.outputs.npm_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pre-release | ${{ steps.version.outputs.is_prerelease }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ steps.context.outputs.branch }}\` |" >> "$GITHUB_STEP_SUMMARY"
