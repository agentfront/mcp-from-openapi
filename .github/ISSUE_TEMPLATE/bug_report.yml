name: Bug report
description: Something behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! For **security issues, do not file a public issue** —
        see [SECURITY.md](https://github.com/agentfront/mcp-from-openapi/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Library version
      placeholder: "2.6.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      placeholder: "Node 22 / Cloudflare Workers / ..."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Provide a minimal, redacted OpenAPI spec and code. Remove API keys, tokens, cookies, credentials, and personal data before posting.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include a redacted error message or wrong output — remove secrets, URLs with credentials, and personal data.
    validations:
      required: true
