# DELIBERATELY INVALID: OpenAPI 3.1 has no `query` operation and no `additionalOperations` (both are 3.2).
# The official 3.1 schema rejects the document; the library reads only the fixed methods of a 3.1
# document, ignores the two newer fields and says so with a FEATURE_NEWER_THAN_DECLARED_VERSION diagnostic.
openapi: 3.1.1
info:
  title: Documents
  version: 1.0.0
servers:
  - url: https://docs.example.com
paths:
  /documents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getDocument
      summary: Read a document
      responses:
        '200':
          description: The document
          content:
            application/json:
              schema:
                type: object
    query:
      operationId: queryDocument
      summary: Search inside a document, with the search in the body
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: The matches
    additionalOperations:
      PURGE:
        operationId: purgeDocument
        summary: Drop the cached copies of a document
        responses:
          '204':
            description: Purged
