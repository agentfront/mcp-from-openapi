# A whole query string next to an API key sent in the query string. A form-urlencoded query string has pairs
# the key can join; a JSON one has none, so the library warns (QUERYSTRING_WITH_QUERY_CREDENTIAL) for the
# first operation. The second (form) and the third (the key travels in a header) have nothing to warn about.
openapi: 3.2.0
info:
  title: Search gateway
  version: 1.0.0
servers:
  - url: https://search.example.com
paths:
  /v1/search-json:
    get:
      operationId: searchJson
      summary: Search with the criteria as JSON
      security:
        - QueryKey: []
      parameters:
        - name: criteria
          in: querystring
          content:
            application/json:
              schema:
                type: object
                properties:
                  text:
                    type: string
      responses:
        '200':
          description: The hits
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /v1/search-form:
    get:
      operationId: searchForm
      summary: Search with the criteria as a form
      security:
        - QueryKey: []
      parameters:
        - name: criteria
          in: querystring
          content:
            application/x-www-form-urlencoded:
              schema:
                type: object
                properties:
                  text:
                    type: string
      responses:
        '200':
          description: The hits
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /v1/search-json-header-key:
    get:
      operationId: searchJsonHeaderKey
      summary: Search with the criteria as JSON and the key in a header
      security:
        - HeaderKey: []
      parameters:
        - name: criteria
          in: querystring
          content:
            application/json:
              schema:
                type: object
                properties:
                  text:
                    type: string
      responses:
        '200':
          description: The hits
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
components:
  securitySchemes:
    QueryKey:
      type: apiKey
      in: query
      name: api_key
    HeaderKey:
      type: apiKey
      in: header
      name: X-API-Key
