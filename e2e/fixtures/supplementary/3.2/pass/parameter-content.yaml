# Parameters defined with `content` (one media type) instead of `schema`, in all four locations.
openapi: 3.2.0
info:
  title: Reporting
  version: 1.0.0
servers:
  - url: https://reports.example.com
paths:
  /reports/{selector}:
    get:
      operationId: getReport
      summary: Fetch a report
      parameters:
        - name: selector
          in: path
          required: true
          content:
            text/plain:
              schema:
                type: string
                pattern: '^[a-z0-9-]+$'
        - name: filter
          in: query
          content:
            application/json:
              schema:
                type: object
                properties:
                  from:
                    type: string
                    format: date
                  to:
                    type: string
                    format: date
        - name: X-Report-Options
          in: header
          content:
            application/json:
              schema:
                type: object
                properties:
                  currency:
                    type: string
                  rounding:
                    type: integer
        - name: X-Note
          in: header
          content:
            text/plain: {}
        - name: X-Context
          in: header
          content:
            application/json: {}
        - name: locale-hint
          in: cookie
          content:
            text/plain:
              schema:
                type: string
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
