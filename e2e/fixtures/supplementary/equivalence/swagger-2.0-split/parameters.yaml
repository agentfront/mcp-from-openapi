# The shared parameters of swagger.yaml: each top-level key is one Parameter Object, reached as `parameters.yaml#/<Key>`.
BookId:
  name: bookId
  in: path
  description: Identifier of the book
  required: true
  type: integer
  format: int64
Limit:
  name: limit
  in: query
  description: Maximum number of results to return
  type: integer
  format: int32
  minimum: 1
  maximum: 100
  default: 20
Offset:
  name: offset
  in: query
  description: Number of results to skip
  type: integer
  format: int32
  minimum: 0
  default: 0
RequestId:
  name: X-Request-Id
  in: header
  description: Correlation identifier, echoed in the logs
  type: string
  format: uuid
