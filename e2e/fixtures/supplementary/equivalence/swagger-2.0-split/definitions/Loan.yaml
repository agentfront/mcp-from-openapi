type: object
description: A book lent to a member
required:
  - id
  - bookId
  - memberId
  - status
properties:
  id:
    type: integer
    format: int64
  bookId:
    type: integer
    format: int64
  memberId:
    type: integer
    format: int64
  dueDate:
    type: string
    format: date
  status:
    type: string
    enum:
      - active
      - returned
      - overdue
