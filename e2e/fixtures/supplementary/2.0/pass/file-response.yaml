# A response whose schema is `type: file`: the body is the file, in whichever media type `produces` lists.
# A 3.x form is `type: string, format: binary` under each of those media types.
swagger: '2.0'
info:
  title: Reports
  version: 1.0.0
host: reports.example.com
schemes:
  - https
paths:
  /reports/{reportId}/download:
    get:
      operationId: downloadReport
      summary: Download a report
      produces:
        - application/pdf
        - application/vnd.ms-excel
      parameters:
        - name: reportId
          in: path
          description: Identifier of the report
          required: true
          type: string
      responses:
        '200':
          description: The report as a file
          headers:
            Content-Disposition:
              type: string
              description: The suggested file name
          schema:
            type: file
        '404':
          description: There is no such report
