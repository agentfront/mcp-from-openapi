# A global body parameter (`#/parameters/Pet`) used by two operations with different media types: the first takes the
# document's `consumes` (JSON), the second its own (`application/xml`). A 3.x form cannot share one request body between
# them as written, because a request body names its media types and these differ per operation.
swagger: '2.0'
info:
  title: Pet Intake
  version: 1.0.0
host: intake.example.com
basePath: /api
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
parameters:
  Pet:
    name: pet
    in: body
    description: The pet to register
    required: true
    schema:
      $ref: '#/definitions/Pet'
paths:
  /pets:
    post:
      operationId: registerPet
      summary: Register a pet
      parameters:
        - $ref: '#/parameters/Pet'
      responses:
        '201':
          description: The pet was registered
          schema:
            $ref: '#/definitions/Pet'
  /pets/import:
    post:
      operationId: importPet
      summary: Register a pet sent as XML
      consumes:
        - application/xml
      parameters:
        - $ref: '#/parameters/Pet'
      responses:
        '201':
          description: The pet was registered
          schema:
            $ref: '#/definitions/Pet'
definitions:
  Pet:
    type: object
    required:
      - name
    properties:
      name:
        type: string
      species:
        type: string
        enum:
          - cat
          - dog
          - bird
    xml:
      name: pet
